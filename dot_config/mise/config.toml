# The stock agents and CLIs are Omarchy's, declared in /etc/mise/conf.d.
[tools]
"cargo:cfspeedtest" = "latest"
"cargo:controld-cli" = "latest"
go = "latest"
java = "lts"
node = "lts"
# Under mise's download threshold; verified as Brave's own, with build provenance.
"npm:@brave/brave-search-cli" = { version = "latest", allow_low_downloads = true }
"npm:@doist/todoist-cli" = "latest"
# Under mise's download threshold; verified as Readwise's own, with build provenance.
"npm:@readwise/cli" = { version = "latest", allow_low_downloads = true }
"npm:agent-browser" = "latest"
"npm:defuddle-cli" = "latest"
"npm:pnpm" = "latest"
ruby = "latest"
zig = "latest"
zls = "latest"

[env]
ANDROID_HOME = "{{ env.HOME }}/Android/Sdk"
_.path = [
    "{{ env.HOME }}/Android/Sdk/cmdline-tools/latest/bin",
    "{{ env.HOME }}/Android/Sdk/platform-tools",
]

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
compile = false
