#!/bin/bash
# Re-append my Obsidian flags block to omarchy's, replacing any earlier copy.
set -e

grep -v -e '^# dotfiles:' -e '^--force-device-scale-factor=' || true
cat <<'FLAGS'
# dotfiles: Electron multiplies GNOME's text scaling into its display scale
# dotfiles: and draws smaller than its window at a non-default text size.
# dotfiles: REVERT once omacom/omarchy#8574 is fixed upstream.
--force-device-scale-factor=1
FLAGS
