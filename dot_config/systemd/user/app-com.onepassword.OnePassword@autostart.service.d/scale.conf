# Electron multiplies GNOME's text scaling into its display scale and draws
# smaller than its window at a non-default text size. 1Password rewrites its
# own autostart entry, so the flag goes on the generated unit instead.
# REVERT once omacom/omarchy#8574 is fixed upstream.
[Service]
ExecStart=
ExecStart=:/opt/1Password/1password --silent --force-device-scale-factor=1
