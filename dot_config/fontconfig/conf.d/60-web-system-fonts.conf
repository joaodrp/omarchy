<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map the Apple/CSS system-font names to Inter (sans) and JetBrains Mono
       (monospace), so pages using the macOS font stack (GitHub, etc.) get a
       close open-source match instead of Liberation Sans.

       Its own file because omarchy-font-set rewrites fonts.conf. -->

  <!-- Apple/CSS UI sans names -> Inter -->
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>-apple-system</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>BlinkMacSystemFont</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>

  <!-- Apple/CSS monospace names -> JetBrains Mono -->
  <match target="pattern"><test name="family"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>SFMono-Regular</string></test><edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Mono</string></test><edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Menlo</string></test><edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test><edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit></match>
</fontconfig>
