<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map the Apple/CSS system-font names to Apple's own fonts (installed from
       Apple into ~/.local/share/fonts/apple) so the web renders like macOS.
       Each rule names a fallback after the Apple font, used while it is
       absent: Inter for sans, JetBrains Mono for monospace.

       fontconfig loads omarchy's /etc/fonts/conf.d/50-omarchy.conf before
       50-user.conf pulls this file in, so the strong rules below beat its
       Liberation Sans fallback. -->

  <!-- Apple/CSS UI sans names -> SF Pro Text (SF Pro Display for large text) -->
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>-apple-system</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>BlinkMacSystemFont</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string><string>Inter</string></edit></match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <test name="pixelsize" compare="more"><double>21</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>

  <!-- Apple/CSS serif name -> New York -->
  <match target="pattern"><test name="family"><string>ui-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>New York</string></edit></match>

  <!-- Apple/CSS monospace names -> SF Mono -->
  <match target="pattern"><test name="family"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Mono</string><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>SFMono-Regular</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Mono</string><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Menlo</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Mono</string><string>JetBrainsMono Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test><edit name="family" mode="prepend" binding="strong"><string>SF Mono</string><string>JetBrainsMono Nerd Font</string></edit></match>
</fontconfig>
